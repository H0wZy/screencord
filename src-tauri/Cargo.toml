[package]
name = "screencord"
version = "1.0.0"
description = "Ultra-lightweight self-hosted Discord alternative for voice and screen sharing calls"
authors = ["H0wZy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
